# Define the services used by the MLOps system
services:

  # PostgreSQL database for MLflow metadata
  postgres:
    image: postgres:18
    container_name: olist-mlflow-postgres

    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_password

    ports:
      - "5433:5432"

    volumes:
      - mlflow_postgres_data:/var/lib/postgresql


  # MinIO object storage for MLflow and DVC artifacts
  minio:
    image: quay.io/minio/minio
    container_name: olist-minio

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345

    ports:
      - "9000:9000"
      - "9001:9001"

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data


  # MLflow tracking server for experiments and model registry
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: olist-mlflow

    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin12345
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000"

    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://mlflow:mlflow_password@postgres:5432/mlflow
      - --artifacts-destination
      - s3://mlflow-artifacts

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - minio


  # FastAPI inference service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-api

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"

    ports:
      - "8000:8000"

    depends_on:
      - mlflow
    volumes:
      - prediction_logs:/app/logs


# Persist service data across container restarts
volumes:
  mlflow_postgres_data:
  minio_data:
  prediction_logs: